[package]
name = "rtic-l476"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Course 2 RTOS tier, RTIC flavour — no_std on the STM32L476RG via the stm32l4 PAC and RTIC 2 (probe-rs); kept apart from mcu/ because two PACs cannot share one binary"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
stm32l4 = { version = "0.16", features = ["stm32l4x6", "rt"] }
rtic = { version = "2.3", features = ["thumbv7-backend"] }
rtic-monotonics = { version = "2", features = ["cortex-m-systick"] }
rtic-sync = "1"
heapless = { workspace = true }
critical-section = { workspace = true }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
unwrap_used = "deny"
expect_used = "deny"
