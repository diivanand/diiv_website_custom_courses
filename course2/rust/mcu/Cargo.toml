[package]
name = "mcu"
edition.workspace = true
version.workspace = true
publish.workspace = true
description = "Course 2 bare-metal + RTOS tiers on the real board — no_std on the STM32L476RG (NUCLEO-L476RG) via embassy-stm32"

[dependencies]
cortex-m = { workspace = true }
cortex-m-rt = { workspace = true }
embassy-stm32 = { version = "0.6", features = ["stm32l476rg", "memory-x", "time-driver-any", "exti", "defmt"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5", features = ["defmt"] }
embassy-sync = "0.8"
embedded-hal = { workspace = true }
heapless = { workspace = true }
static_cell = "2"
critical-section = { workspace = true }
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = "warn"
unwrap_used = "deny"
expect_used = "deny"
