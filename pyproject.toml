[project]
name = "diiv-course-labs"
version = "0.1.0"
description = "Shared Python for all diiv.io course workspaces: simulate-first prototypes, serial capture, analysis, and plotting (per-lab work in course2/labs/lab-M-N/host/)"
requires-python = ">=3.13"
dependencies = [
    # numerics + DSP reference implementations
    "numpy",
    "scipy",
    # plotting + notebooks (JupyterLab, ipykernel, nbconvert included)
    "matplotlib",
    "jupyter",
    "jupyterlab",
    # instrument / device links
    "pyserial",
    # audio labs (M6, M8, M9): playback/capture + WAV I/O + features
    "sounddevice",
    "soundfile",
    "librosa",
    # image & video labs (M9): reference implementations the device output is checked against
    "opencv-python",
    "pillow",
]

[dependency-groups]
# Module 8 training/export notebooks — heavyweight, pull in only when needed:
#   uv sync --group ml
ml = [
    "torch",
    "onnx",
    "onnxruntime",
    "tensorflow",
]
